name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.4'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration
      - name: Text stream cancellation E2E
        working-directory: backend
        run: |
          go build -o "$RUNNER_TEMP/stream-cancellation-e2e" ./e2e/stream-cancellation
          python3 e2e/stream-cancellation/check.py --binary "$RUNNER_TEMP/stream-cancellation-e2e" --out "$RUNNER_TEMP/stream-cancellation-anthropic" &
          anthropic_pid=$!
          python3 e2e/stream-cancellation/check.py --binary "$RUNNER_TEMP/stream-cancellation-e2e" --provider openai --out "$RUNNER_TEMP/stream-cancellation-openai" &
          openai_pid=$!
          result=0
          wait "$anthropic_pid" || result=1
          wait "$openai_pid" || result=1
          exit "$result"
      - name: PostgreSQL billing E2E
        working-directory: backend
        run: go run ./tools/production-billing-e2e --output "$RUNNER_TEMP/production-billing/receipt.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stream-cancellation-${{ github.event_name }}
          path: |
            ${{ runner.temp }}/stream-cancellation-anthropic/
            ${{ runner.temp }}/stream-cancellation-openai/
            ${{ runner.temp }}/production-billing/receipt.json
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.4'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify independent fork version end to end
        run: python3 .github/release-tools/check-fork-version-e2e.py --output version-policy-evidence/summary.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fork-version-policy
          path: version-policy-evidence/
          if-no-files-found: error
      - run: bash -n .github/release-tools/release-images.sh
